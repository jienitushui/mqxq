search-api:
  api-key: sZopga6DFDkXTzxPnL9bmHD2

# 文件清理配置
file:
  cleanup:
    # 是否启用自动清理
    enabled: true
    # 文件保留时间（小时），超过此时间的文件将被删除
    retention-hours: 24
    # 清理任务执行时间（Cron表达式：秒 分 时 日 月 周）
    # 默认每天凌晨3点执行
    cron: "0 0 3 * * ?"
    # 文件保存根目录（默认：项目根目录/tmp）
    base-dir: ${user.dir}/tmp