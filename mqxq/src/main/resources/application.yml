# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    #自定义swagger前端请求路径,输入http:localhost:8080/swagger-ui会自动重定向到swagger页面
    path: /swagger-ui
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs  #swagger后端请求地址
    enabled: true   #是否开启文档功能
  group-configs: #分组配置,可配置多个分组
    - group: 'default'             #分组名称
      paths-to-match: '/**'        #配置需要匹配的路径
      packages-to-scan: com.jieni.mqxq.controller    #配置要扫描包的路径,一般配置到启动类所在的包名
    - group: 'auth-api'
      paths-to-match: '/**'
      packages-to-scan: com.jieni.mqxq.controller.auth
    - group: 'admin-api'
      paths-to-match: '/**'
      packages-to-scan: com.jieni.mqxq.controller.admin
    - group: 'teacher-api'
      paths-to-match: '/**'
      packages-to-scan: com.jieni.mqxq.controller.teacher
    - group: 'user-api'
      paths-to-match: '/**'
      packages-to-scan: com.jieni.mqxq.controller.user
    - group: 'public-api'
      paths-to-match: '/**'
      packages-to-scan: com.jieni.mqxq.controller.publicapi

# knife4j的增强配置，不需要增强可以不配
knife4j:
  enable: true    #开启knife4j,无需添加@EnableKnife4j注解
  setting:
    language: zh_cn   #中文
    swagger-model-name: 实体列表   #默认为：Swagger Models
  #开启Swagger的Basic认证功能,默认是false,开启后访问文档页面时会弹出用户名和密码输入框
  basic:
    enable: true
    # Basic认证用户名
    username: user
    # Basic认证密码
    password: Lvjiawei@264357

spring:
  cache: #缓存管理相关配置
    type: redis  #采用redis进行缓存管理
    redis: #针对redis作为缓存管理时的工作配置
      use-key-prefix: true
      key-prefix: cache_
      cache-null-values: false
      time-to-live: 100s
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
#    password: 123456
    password: Lvjiawei@264357
#    url: jdbc:mysql://localhost:3306/mqxq?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&maxLifetime=1800000&allowPublicKeyRetrieval=true
    url: jdbc:mysql://159.75.11.181:3306/mqxq?useUnicode=true&characterEncoding=utf-8&allowMultiQueries=true&useSSL=false&serverTimezone=Asia/Shanghai&maxLifetime=1800000&allowPublicKeyRetrieval=true
  servlet:
    multipart:
      max-file-size: 100MB
      max-request-size: 100MB
  #  Rabbimq配置
  rabbitmq:
    # 主机名
    host: 159.75.11.181
    # 端口
    port: 5673
    # 虚拟主机（使用 / 表示默认虚拟主机）
    virtual-host: /
    # 用户名
    username: mqxq_admin
    # 密码
    password: Lvjiawei@264357
    # 连接超时配置（毫秒）
    connection-timeout: 30000
    # 请求心跳超时（秒），防止连接被关闭
    requested-heartbeat: 60
    # 启用详细日志（用于调试）
    template:
      mandatory: false
    # 发布确认模式
    publisher-confirm-type: correlated
    # 发布返回确认
    publisher-returns: true
    # 监听器配置
    listener:
      simple:
        # 自动确认模式
        acknowledge-mode: auto
        # 并发消费者数量
        concurrency: 1
        # 最大并发消费者数量
        max-concurrency: 10
        # 预取数量
        prefetch: 1
        # 自动启动（暂时禁用，等连接问题解决后再启用）
        auto-startup: true
        # 启动时延迟（毫秒），等待连接建立
        startup-timeout: 30000
        # 重试配置
        retry:
          enabled: true
          initial-interval: 1000
          max-attempts: 3
          max-interval: 10000
          multiplier: 1.2
  # redis配置
  data:
    redis:
      database: 1
      # Redis服务器地址
#      host: 127.0.0.1
      host: 159.75.11.181
      # Redis服务器连接端口
      port: 6379
      # Redis服务器连接密码（默认为空）
#      password: 123456
      password: Lvjiawei@264357
      # 连接超时时间
      timeout: 10s
      # 连接池配置
      lettuce:
        pool:
          # 连接池最大连接数
          max-active: 200
          # 连接池最大阻塞等待时间（使用负值表示没有限制）
          max-wait: -1ms
          # 连接池中的最大空闲连接
          max-idle: 10
          # 连接池中的最小空闲连接
          min-idle: 0
#          # 连接扫描间隔时间（毫秒）
#          time-between-eviction-runs: 10s

  elasticsearch:
#    uris: http://localhost:19200
    uris: http://159.75.11.181:19200

  ai:
    dashscope:
      api-key: sk-e90a0b708410445cad345001dab94c43
